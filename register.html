{% extends "base.html" %}

{% block auth_content %}

<div class="auth-page">

    <div class="auth-left">

        <div class="wallet-big">
            💰
        </div>

        <h1>
            Smart Expense Tracker
        </h1>

        <h3>
            with Budget Prediction
        </h3>

        <p>
            Track Today • Plan Tomorrow • Build Your Future
        </p>

        <div class="auth-graphic">
            📊
        </div>

    </div>


    <div class="auth-card register-card">

        <h2>
            Create Account
        </h2>

        <p class="muted">
            Fill in your details to get started
        </p>

        <form method="POST">

            <label>
                Full Name
            </label>

            <input
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>
                Email ID
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Phone Number
            </label>

            <input
                name="phone"
                placeholder="Enter your phone number"
            >

            <label>
                Monthly Income
            </label>

            <input
                type="number"
                step="0.01"
                name="salary"
                placeholder="Enter monthly income"
            >

            <label>
                Location
            </label>

            <input
                name="location"
                placeholder="Enter your location"
            >

            <label>
                Gender
            </label>

            <select name="gender">

                <option value="">
                    Select
                </option>

                <option>
                    Male
                </option>

                <option>
                    Female
                </option>

                <option>
                    Other
                </option>

            </select>

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

            <button class="primary-btn">
                Register
            </button>

        </form>

        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}

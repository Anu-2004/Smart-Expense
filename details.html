<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Personal Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="gradient-bg">

<div class="container">

<div class="glass-card form-card">

<h2 class="text-center mb-4">
    <i class="fa-solid fa-id-card"></i>
    Personal Details
</h2>

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input type="text"
       name="name"
       class="form-control"
       value="{{ details.name if details else '' }}"
       required>

</div>

<div class="mb-3">

<label>Salary ₹</label>

<input type="number"
       name="salary"
       class="form-control"
       min="1"
       step="0.01"
       value="{{ details.salary if details else '' }}"
       required>

<small class="text-muted">
30% will be treated as savings target and 70% as spending limit.
</small>

</div>

<div class="mb-3">

<label>Email ID</label>

<input type="email"
       name="email"
       class="form-control"
       value="{{ details.email if details else '' }}"
       required>

</div>

<div class="mb-3">

<label>Mobile Number</label>

<input type="text"
       name="mobile"
       class="form-control"
       value="{{ details.mobile if details else '' }}"
       required>

</div>

<div class="mb-3">

<label>Location</label>

<input type="text"
       name="location"
       class="form-control"
       value="{{ details.location if details else '' }}">

</div>

<div class="mb-4">

<label>Gender</label>

<select name="gender" class="form-select">

<option value="">Select Gender</option>

<option value="Male"
{% if details and details.gender == "Male" %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if details and details.gender == "Female" %}selected{% endif %}>
Female
</option>

<option value="Other"
{% if details and details.gender == "Other" %}selected{% endif %}>
Other
</option>

</select>

</div>

<button class="btn btn-primary w-100">

<i class="fa-solid fa-arrow-right"></i>

Save & Continue

</button>

</form>

</div>

</div>

</body>
</html>

{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <div class="logo-circle">

            <i class="fa-solid fa-shield-halved"></i>

        </div>

        <h2>OTP Verification</h2>

        <p class="text-muted">
            Enter your 6 digit OTP
        </p>


        {% if demo_otp %}

        <div class="otp-demo">

            <i class="fa-solid fa-key"></i>

            Demo OTP:

            <strong>{{ demo_otp }}</strong>

        </div>

        {% endif %}


        <form method="POST">

            <input
                class="form-control form-control-lg text-center mb-3"
                name="otp"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                required>


            <button
                class="btn btn-success btn-lg w-100">

                <i class="fa-solid fa-check"></i>

                Verify OTP

            </button>

        </form>

    </div>

</div>

{% endblock %}

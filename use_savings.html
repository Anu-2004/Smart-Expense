<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Use Savings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="gradient-bg">

<div class="container">

<div class="glass-card form-card">

<h2 class="text-center">
Use Savings
</h2>

<div class="available-box">

Available Savings:

<strong>
₹{{ "%.2f"|format(available) }}
</strong>

</div>

<form method="POST">

<div class="mb-3">

<label>Amount to Use ₹</label>

<input type="number"
       name="amount"
       class="form-control"
       min="0.01"
       max="{{ available }}"
       step="0.01"
       required>

</div>

<div class="mb-3">

<label>Reason</label>

<textarea name="reason"
          class="form-control"
          rows="4"
          placeholder="Example: Emergency / Education / Travel"
          required></textarea>

</div>

<button class="btn btn-warning w-100">

Use Savings

</button>

</form>

<a href="{{ url_for('savings') }}"
   class="btn btn-outline-secondary w-100 mt-3">

Back

</a>

</div>

</div>

</body>
</html>

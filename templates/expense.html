{% extends "base.html" %}

{% block content %}

<div class="page-heading">

    <div>

        <h1>
            Add Expense
        </h1>

        <p>
            Record your daily spending.
        </p>

    </div>

</div>


<div class="form-panel">

    <form method="POST">

        <div class="form-grid">

            <div>

                <label>
                    Amount (₹)
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="amount"
                    placeholder="Enter amount"
                    required
                >

            </div>


            <div>

                <label>
                    Category
                </label>

                <select name="category">

                    <option>
                        Food
                    </option>

                    <option>
                        Transport
                    </option>

                    <option>
                        Shopping
                    </option>

                    <option>
                        Bills
                    </option>

                    <option>
                        Education
                    </option>

                    <option>
                        Medical
                    </option>

                    <option>
                        Entertainment
                    </option>

                    <option>
                        Other
                    </option>

                </select>

            </div>


            <div>

                <label>
                    Reason
                </label>

                <input
                    name="reason"
                    placeholder="Example: Lunch"
                    required
                >

            </div>


            <div>

                <label>
                    Date & Time
                </label>

                <input
                    value="Automatically recorded"
                    disabled
                >

            </div>

        </div>


        <label>
            Description
        </label>

        <textarea
            name="description"
            placeholder="Enter description"
        ></textarea>


        <div class="suggestions">

            <span>Suggested Reasons:</span>

            <button
                type="button"
                onclick="setReason('Food')">
                Food
            </button>

            <button
                type="button"
                onclick="setReason('Travel')">
                Travel
            </button>

            <button
                type="button"
                onclick="setReason('Shopping')">
                Shopping
            </button>

            <button
                type="button"
                onclick="setReason('Bills')">
                Bills
            </button>

            <button
                type="button"
                onclick="setReason('Education')">
                Education
            </button>

        </div>


        <button class="primary-btn">
            Add Expense
        </button>

    </form>

</div>


<script>

function setReason(value) {

    document.querySelector(
        'input[name="reason"]'
    ).value = value;

}

</script>

{% endblock %}

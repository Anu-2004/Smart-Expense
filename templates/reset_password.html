{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <div class="logo-circle">

            <i class="fa-solid fa-lock"></i>

        </div>

        <h2>Reset Password</h2>


        {% if demo_otp %}

        <div class="otp-demo">

            Demo OTP:

            <strong>{{ demo_otp }}</strong>

        </div>

        {% endif %}


        <form method="POST">

            <input
                class="form-control mb-3"
                name="otp"
                placeholder="Enter OTP"
                required>


            <input
                class="form-control mb-3"
                type="password"
                name="password"
                placeholder="New Password"
                required>


            <input
                class="form-control mb-3"
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>


            <button
                class="btn btn-primary btn-lg w-100">

                Reset Password

            </button>

        </form>

    </div>

</div>

{% endblock %}

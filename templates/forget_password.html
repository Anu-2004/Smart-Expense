{% extends "base.html" %}

{% block content %}

<div class="auth-wrap">

    <div class="auth-card">

        <div class="logo-circle">

            <i class="fa-solid fa-key"></i>

        </div>

        <h2>Forgot Password</h2>

        <p class="text-muted">
            Enter your registered email
        </p>


        <form method="POST">

            <input
                class="form-control mb-3"
                type="email"
                name="email"
                placeholder="Email ID"
                required>


            <button
                class="btn btn-primary btn-lg w-100">

                Generate OTP

            </button>

        </form>


        <div class="mt-3">

            <a href="{{ url_for('login') }}">
                Back to Login
            </a>

        </div>

    </div>

</div>

{% endblock %}

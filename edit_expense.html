{% extends "base.html" %}

{% block content %}

<div class="page-heading">

    <div>

        <h1>
            Edit Expense
        </h1>

    </div>

</div>


<div class="form-panel">

    <form method="POST">

        <label>
            Amount (₹)
        </label>

        <input
            type="number"
            step="0.01"
            name="amount"
            value="{{ expense.amount }}"
            required
        >


        <label>
            Category
        </label>

        <select name="category">

            {% for item in [
                "Food",
                "Transport",
                "Shopping",
                "Bills",
                "Education",
                "Medical",
                "Entertainment",
                "Other"
            ] %}

                <option
                    {% if expense.category == item %}
                    selected
                    {% endif %}
                >
                    {{ item }}
                </option>

            {% endfor %}

        </select>


        <label>
            Reason
        </label>

        <input
            name="reason"
            value="{{ expense.reason }}"
            required
        >


        <label>
            Description
        </label>

        <textarea
            name="description"
        >{{ expense.description or "" }}</textarea>


        <button class="primary-btn">
            Update Expense
        </button>

    </form>

</div>

{% endblock %}

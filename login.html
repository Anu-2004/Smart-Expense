{% extends "base.html" %}

{% block auth_content %}

<div class="auth-page">

    <div class="auth-left">

        <div class="wallet-big">
            💰
        </div>

        <h1>
            Smart Expense Tracker
        </h1>

        <h3>
            with Budget Prediction
        </h3>

        <p>
            Track Today • Plan Tomorrow • Build Your Future
        </p>

        <div class="auth-graphic">
            📈
        </div>

    </div>


    <div class="auth-card">

        <h2>
            Welcome Back!
        </h2>

        <p class="muted">
            Login to your account
        </p>

        <form method="POST">

            <label>
                Email ID
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button class="primary-btn">
                Login
            </button>

        </form>

        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}

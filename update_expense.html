<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="page-container">

    <div class="login-box">

        <h2>
            Update Expense
        </h2>

        <p class="subtitle">
            Edit your expense
        </p>


        <form method="POST">


            <!-- ITEM -->

            <div class="mb-3">

                <label class="form-label">
                    Expense Item
                </label>

                <input type="text"
                       name="item"
                       class="form-control"
                       value="{{ expense.item }}"
                       required>

            </div>


            <!-- AMOUNT -->

            <div class="mb-3">

                <label class="form-label">
                    Amount
                </label>

                <input type="number"
                       name="amount"
                       class="form-control"
                       value="{{ expense.amount }}"
                       min="1"
                       step="0.01"
                       required>

            </div>


            <!-- CATEGORY -->

            <div class="mb-4">

                <label class="form-label">
                    Category
                </label>

                <select name="category"
                        class="form-select"
                        required>

                    <option value="Food"
                        {% if expense.category == "Food" %}selected{% endif %}>
                        Food
                    </option>

                    <option value="Travel"
                        {% if expense.category == "Travel" %}selected{% endif %}>
                        Travel
                    </option>

                    <option value="Shopping"
                        {% if expense.category == "Shopping" %}selected{% endif %}>
                        Shopping
                    </option>

                    <option value="Bills"
                        {% if expense.category == "Bills" %}selected{% endif %}>
                        Bills
                    </option>

                    <option value="Education"
                        {% if expense.category == "Education" %}selected{% endif %}>
                        Education
                    </option>

                    <option value="Medical"
                        {% if expense.category == "Medical" %}selected{% endif %}>
                        Medical
                    </option>

                    <option value="Other"
                        {% if expense.category == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>

            </div>


            <button type="submit"
                    class="btn btn-primary w-100 login-btn">

                <i class="fa-solid fa-pen-to-square"></i>

                Update Expense

            </button>


        </form>


        <div class="create-account">

            <a href="{{ url_for('view_expense') }}">

                ← Back to View Expense

            </a>

        </div>

    </div>

</div>

</body>

</html>
